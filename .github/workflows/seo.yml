name: seo

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  technical-seo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build and verify prerendered SEO before deployment
        run: npm run test:seo
