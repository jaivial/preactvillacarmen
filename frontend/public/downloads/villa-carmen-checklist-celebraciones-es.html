os y niños; no equivale a un aforo confirmado</span></label><label><input type="checkbox"> <span>Espacios preferidos y alternativa ante lluvia o cambios de montaje</span></label><label><input type="checkbox"> <span>Objetivos, ambiente y prioridades de los asistentes</span></label></section><section><h2>2. Menú y asistentes</h2><label><input type="checkbox"> <span>Platos, bebidas, café, suplementos y condiciones por escrito</span></label><label><input type="checkbox"> <span>Alergias, intolerancias y adaptaciones consultadas con el equipo</span></label><label><input type="checkbox"> <span>Mínimo de comensales, elección de platos y fecha límite de confirmación</span></label><label><input type="checkbox"> <span>Opciones para niños incluidas en la propuesta actual</span></label></section><section><h2>3. Coordinación</h2><label><input type="checkbox"> <span>Recorrido de ceremonia, aperitivo, comida y celebración</span></label><label><input type="checkbox"> <span>Accesos, montaje, recogida y contactos de cada proveedor</span></label><label><input type="checkbox"> <span>Plano de mesas, accesibilidad y necesidades técnicas confirmadas</span></label><label><input type="checkbox"> <span>Permiso escrito y crédito de autor antes de publicar fotos de celebraciones privadas</span></label></section><section><h2>4. Confirmación</h2><label><input type="checkbox"> <span>Número final de asistentes y fecha límite de cambios</span></label><label><input type="checkbox"> <span>Menú, espacio, horarios, precio y condiciones confirmados por escrito</span></label><label><input type="checkbox"> <span>Contacto operativo y responsable de cada decisión</span></label><label><input type="checkbox"> <span>Presupuesto y pagos registrados sin datos privados en documentos compartidos</span></label></section></main><footer><a href="https://www.alqueriavillacarmen.com/checklist-celebraciones">Volver a la guía y solicitar propuesta</a></footer></body></html>
